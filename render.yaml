# Сервер Twin Closet на Render (решение 28.10): сборка из Dockerfile, всегда включён.
# Диска нет: состояние и файлы — в Supabase (supabase/migrations/0002_server_state.sql), /data — только рабочая папка.
# Секреты (ключ Meta, секретный ключ Supabase) вводятся в Render вручную (sync: false) — в репозиторий не попадают.
services:
  - type: web
    name: twin-closet-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: RETAIN_HOURS
        value: "48"
      - key: LIMIT_UPLOADS_PER_HOUR
        value: "30"
      - key: LIMIT_JOBS_PER_DAY
        value: "40"
      - key: LIMIT_JOBS_PER_DAY_TOTAL
        value: "600"
      - key: SUPABASE_URL
        value: https://dcdnnaympaslizdvqdcf.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      # своё пространство в Supabase; сервер на ПК пишет в dev и данные не перемешиваются
      - key: SUPABASE_SPACE
        value: main
      - key: MODEL_API_KEY
        sync: false
